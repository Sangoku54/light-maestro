<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0f;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; font-family: -apple-system, Segoe UI, sans-serif;
    overflow: hidden; user-select: none;
  }
  .splash {
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    animation: pulse 2s ease-in-out infinite;
  }
  .title {
    color: #e2e8f0; font-size: 22px; font-weight: 700;
    letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .subtitle {
    color: #64748b; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 24px;
  }
  .loader {
    width: 120px; height: 3px; background: #1e293b;
    border-radius: 2px; margin: 0 auto; overflow: hidden;
  }
  .loader-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #06b6d4, #8b5cf6);
    border-radius: 2px;
    animation: load 2.5s ease-in-out infinite;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes load { 0% { width:0%; } 50% { width:70%; } 100% { width:0%; } }
</style>
</head>
<body>
<div class="splash">
  <div class="logo">💡</div>
  <div class="title">Light Maestro</div>
  <div class="subtitle">Démarrage en cours...</div>
  <div class="loader"><div class="loader-bar"></div></div>
</div>
</body>
</html>
